[project]
name = "holodeck"
version = "0.1.0"
description = "LLM-directed, video-diffusion-rendered infinite interactive story engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
veo = ["google-genai>=0.3"]
runway = []
dev = ["ruff>=0.7", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holodeck"]

[tool.ruff]
line-length = 100
target-version = "py311"
